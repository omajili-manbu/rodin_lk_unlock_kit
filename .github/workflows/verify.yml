name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: compile tools
        run: python3 -m py_compile tools/*.py

      - name: verify image checksums
        working-directory: images
        run: sha256sum -c SHA256SUMS.txt

      - name: verify image structure
        run: python3 tools/verify_our_lk.py --all

      - name: signer self-test
        run: python3 tools/sign_token.py --self-test
